<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8e1">
<meta name="description" content="Daily English and Chinese words, plus the alphabet, for children aged 4 and up.">
<title>Daily Words</title>
<link rel="icon" href="img/1f989.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ Home ============ -->
<main id="home" class="screen on">
  <div class="mascot" aria-hidden="true">🦉</div>
  <h1>Daily Words</h1>
  <div class="stats"><span class="pill" id="home-stars">⭐ 0</span><span class="pill" id="home-streak">🔥 0 days</span></div>

  <div class="settings">
    <div class="seg" role="group" aria-label="Language">
      <button data-lang="en">🇬🇧 English</button>
      <button data-lang="zh">🇨🇳 中文</button>
    </div>
    <div class="seg" role="group" aria-label="Level">
      <button data-level="easy">🐣 Easy</button>
      <button data-level="hard">🦁 Hard</button>
    </div>
    <p class="caption" id="level-caption"></p>
  </div>

  <div class="menu">
    <button class="menu-card" id="m-today">
      <span class="m-pic">📚</span><b>Today's words</b><small id="today-preview"></small>
    </button>
    <button class="menu-card" id="m-review">
      <span class="m-pic">🔁</span><b>Review past days</b><small>Practise earlier lessons</small>
    </button>
    <button class="menu-card" id="m-abc">
      <span class="m-pic">🔤</span><b>ABC</b><small>Aa Bb Cc with pictures</small>
    </button>
    <button class="menu-card" id="m-exam">
      <span class="m-pic">📝</span><b>Test</b><small id="exam-best">No hints · check what you know</small>
    </button>
  </div>
  <p class="credit">Pictures: <a href="https://github.com/jdecked/twemoji" target="_blank" rel="noopener">Twemoji</a>, CC-BY 4.0</p>
</main>

<!-- ============ Review past days ============ -->
<main id="days" class="screen">
  <header class="topbar">
    <button class="round home-btn" aria-label="Home">🏠</button>
    <h2>Review past days</h2>
    <span class="spacer"></span>
  </header>
  <p class="caption" id="days-caption"></p>
  <div id="daylist" class="daylist"></div>
</main>

<!-- ============ Lesson ============ -->
<main id="play" class="screen">
  <header class="topbar">
    <button class="round home-btn" aria-label="Home">🏠</button>
    <div id="dots" aria-hidden="true"></div>
    <span class="pill" id="stars" aria-label="Stars">⭐ 0</span>
  </header>
  <div class="note voice-note" hidden></div>
  <div class="stage">
    <section class="picture">
      <button id="pic" class="pic-card" aria-label="Hear it again"></button>
      <div id="word-info" class="word-info"></div>
      <div class="hint-text">Tap the picture to hear it<span class="kbd"> · or press Space</span></div>
    </section>
    <section class="spell">
      <div id="prompt" class="prompt"></div>
      <div id="slots" aria-hidden="true"></div>
      <div id="tiles"></div>
      <div id="msg" aria-live="polite"></div>
      <button id="ready" class="big alt" hidden>I'm ready ➜</button>
      <button id="next" class="big">Next ➜</button>
    </section>
  </div>
</main>

<!-- ============ Lesson finished ============ -->
<main id="done" class="screen">
  <h1>🎉 You did it! 🎉</h1>
  <p id="done-title">You learned:</p>
  <div id="learned"></div>
  <p id="done-streak"></p>
  <div class="buttons">
    <button class="big" id="again">🔁 Again</button>
    <button class="big alt" id="bonus">🎁 Bonus word</button>
    <button class="big home home-btn">🏠 Home</button>
  </div>
</main>

<!-- ============ Test (no hints) ============ -->
<main id="exam" class="screen">
  <header class="topbar">
    <button class="round home-btn" aria-label="Home">🏠</button>
    <div id="exam-dots" aria-hidden="true"></div>
    <span class="pill" id="exam-stars">⭐ 0</span>
  </header>
  <div class="note voice-note" hidden></div>
  <div class="stage" id="exam-stage">
    <section class="picture">
      <button id="exam-pic" class="pic-card" aria-label="Hear the question again"></button>
      <div id="exam-word" class="word-info"></div>
    </section>
    <section class="spell">
      <div id="exam-prompt" class="prompt"></div>
      <div class="slots-row">
        <div id="exam-slots" aria-hidden="true"></div>
        <button class="round" id="exam-undo" aria-label="Take back the last one" hidden>⌫</button>
      </div>
      <div id="exam-tiles"></div>
      <div id="exam-msg" class="msg" aria-live="polite"></div>
      <button id="exam-check" class="big alt" hidden>Check ✓</button>
      <button id="exam-next" class="big" hidden>Next ➜</button>
    </section>
  </div>
  <div id="exam-results" class="results" hidden>
    <h1 id="exam-score"></h1>
    <p id="exam-verdict"></p>
    <p id="exam-missed-title" class="caption">Words to practise · tap to hear:</p>
    <div id="exam-missed"></div>
    <div class="buttons">
      <button class="big" id="exam-again">🔁 Try again</button>
      <button class="big home home-btn">🏠 Home</button>
    </div>
  </div>
</main>

<!-- ============ Alphabet ============ -->
<main id="abc" class="screen">
  <header class="topbar">
    <button class="round home-btn" aria-label="Home">🏠</button>
    <h2>ABC</h2>
    <span class="spacer"></span>
  </header>
  <div class="buttons">
    <button class="big alt" id="abc-game-btn">🎮 Letter game</button>
    <button class="big" id="abc-test-btn">📝 Letter test</button>
  </div>
  <div id="abc-grid" class="abc-grid"></div>
</main>

<!-- One letter -->
<main id="letter" class="screen">
  <header class="topbar">
    <button class="round" id="letter-back" aria-label="Back to ABC">🔤</button>
    <span class="pill" id="letter-count"></span>
    <button class="round home-btn" aria-label="Home">🏠</button>
  </header>
  <div class="letter-stage">
    <button class="round arrow" id="prev" aria-label="Previous letter">⬅️</button>
    <button class="letter-card" id="letter-card" aria-label="Hear the letter">
      <span class="letter-big"><span class="cap" id="cap">A</span><span class="low" id="low">a</span></span>
      <span class="letter-pic" id="letter-pic"></span>
      <span class="letter-word" id="letter-word"></span>
    </button>
    <button class="round arrow" id="nextL" aria-label="Next letter">➡️</button>
  </div>
  <div class="hint-text">Tap the card to hear it<span class="kbd"> · arrow keys to move</span></div>
</main>

<!-- Letter game -->
<main id="abcgame" class="screen">
  <header class="topbar">
    <button class="round" id="game-back" aria-label="Back to ABC">🔤</button>
    <div id="game-dots" aria-hidden="true"></div>
    <span class="pill" id="game-stars">⭐ 0</span>
  </header>
  <div class="game-stage">
    <button class="prompt-card" id="game-prompt" aria-label="Hear it again"></button>
    <div id="choices" class="choices"></div>
    <div id="game-msg" class="msg" aria-live="polite"></div>
    <div class="buttons" id="game-end" hidden>
      <button class="big" id="game-again">🔁 Play again</button>
      <button class="big alt" id="game-abc">🔤 ABC</button>
    </div>
  </div>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
